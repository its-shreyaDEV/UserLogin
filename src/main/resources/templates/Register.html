<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<brbody>

	<div class="container">

		<h1 class="text-center">REGISTER</h1>

		<form th:action="${user.slNo != null} ? @{/updateUser} : @{/register}"
		 th:object="${user}" method="post" class="mt-3">
<input type="text" th:if="${user.slNo != null}" th:value="${user.slNo}" name="userId" hidden/>
			<div class="row g-3">

				<div class="col-md-6">
					<label class="form-label">Email Id</label>
					<span style="color:red;">*</span>
					<input type="email" class="form-control" th:field="*{email}" placeholder="name@gmail.com" required>
				</div>

				<div class="col-md-6">
					<label class="form-label">UserName</label>
					<span style="color:red;">*</span>
					<input type="text" class="form-control" th:field="*{username}" placeholder="Enter your username"required>
				</div>

			</div>

			<div class="mt-3">
				<label class="form-label">Select User Role</label>
				<span style="color:red;">*</span>
				<select class="form-select" th:field="*{role}" placeholder="Enter your username"required>
					<option value="">Select User Role</option>
					
					<option value="Admin">Admin</option>
					<option value="User">User</option>
					<option value="Guest">Guest</option>
					
				</select>
			</div>

			<div class="row g-3 mt-2">

				<div class="col-md-6">
					<label class="form-label">Valid From</label>

					<input type="date" class="form-control" th:field="*{validFrom}" th:value="${user?.validFrom}">
				</div>

				<div class="col-md-6">
					<label class="form-label">Valid To</label>
					<span style="color:red;">*</span>
					<input type="date" class="form-control" th:field="*{validTo}" th:value="${user?.validTo}" required>
				</div>

			</div>

			<br>

			<button type="submit" class="btn btn-primary">
				Submit
			</button>

		</form>
	</div>
	</body>

</html>
