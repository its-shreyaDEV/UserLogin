<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Login User</title>
    <!-- icons -->
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet">
</head>

<body>
<div class="container mt-5">
	
	
    <h1>LOGIN</h1>
    <form th:action="@{/login}" 
          th:object="${user}" 
          method="post" 
          class="mt-3">

		  
		  <!-- th:field="*{email}" binds to UserEntity.email-->
        <!-- UserID-->
        <div class="form-group mb-3">
            <label class="form-label">
                <i class="fa-solid fa-house"></i> User Id
				<span style="color:red;">*</span>
            </label>
            <input type="text" 
                   class="form-control" 
                   th:field="*{username}"
                   placeholder="Enter your userId" required>
        </div>

        <!-- PASSWORD -->
        <div class="form-group mb-3">
            <label class="form-label">Password</label>
			<span style="color:red;">*</span>
            <!--type="password" hides the characters  -->
            <input type="password" 
                   class="form-control" 
                   th:field="*{password}"
                   placeholder="Enter your password"required >
        </div>
		
		<div class="Update-password-container">
		  <a href="/updatePassword" class="Update-password-link">Update password?</a>
		 
		  
		  <form th:action="@{/UpdatePassword}" 
		            th:object="${user}" 
		            method="get" 
		            class="mt-3">

		</div>
		<br>
		
		<!--Error-->
		<p th:if="${error}" th:text="${error}" class="text-danger small mb-2"></p>		

        <!-- SUBMIT BUTTON -->
        <button type="submit" class="btn btn-primary">Submit</button>

    </form>
</div>
</body>
</html>
